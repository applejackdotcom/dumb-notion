<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dumb Notion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Lora:wght@400;700&family=Nunito:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4EEE1; --paper2:#EDE5D3; --ink:#2B2620; --mute:#8A8172; --line:rgba(60,45,20,.12);
  --accent:#C2652A; --glass:rgba(250,246,237,.78); --surface:#FBF8F1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:100%/1.55 system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
#app{display:grid;grid-template-columns:240px 1fr;height:100vh}
/* sidebar */
aside{background:var(--paper2);border-right:1px solid var(--line);padding:44px 10px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto}
aside h2{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:8px 10px}
.page{padding:7px 10px;border-radius:8px;cursor:default;display:flex;justify-content:space-between;align-items:center;font-size:.92rem}
.page:hover{background:rgba(0,0,0,.04)}
.page.on{background:rgba(194,101,42,.12);color:var(--accent);font-weight:600}
.page .x{opacity:0;color:var(--mute);border:0;background:none;cursor:pointer}
.page:hover .x{opacity:1}
.btn{border:0;background:none;color:var(--ink);font:inherit;padding:7px 10px;border-radius:8px;text-align:left;cursor:pointer}
.btn:hover{background:rgba(0,0,0,.05)}
.btn:active{transform:scale(.97);transition:transform 100ms ease-out}
/* main */
main{position:relative;overflow:hidden;display:flex;flex-direction:column}
header{position:absolute;top:0;left:0;right:0;z-index:5;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;
  background:var(--glass);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);-webkit-app-region:drag}
header *{-webkit-app-region:no-drag}
.seg{display:flex;background:rgba(0,0,0,.06);border-radius:9px;padding:2px}
.seg button{border:0;background:none;font:inherit;font-size:.85rem;padding:5px 14px;border-radius:7px;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
/* pomodoro */
.pomo{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.pomo .t{font-weight:600;font-size:1rem;min-width:52px;text-align:right}
.pomo .m{font-size:.75rem;color:var(--mute)}
.pomo button{border:0;background:var(--ink);color:var(--paper);border-radius:999px;width:30px;height:30px;cursor:pointer;font-size:.8rem}
.pomo button.ghost{background:rgba(0,0,0,.07);color:var(--ink)}
.pomo button:active{transform:scale(.92);transition:transform 100ms}
.pomo .bar{width:90px;height:4px;border-radius:2px;background:rgba(0,0,0,.08);overflow:hidden}
.pomo .bar i{display:block;height:100%;background:var(--accent);width:0}
/* editor */
#editorView{overflow:auto;height:100%;padding:52px 0 120px}
.sheet{padding-top:28px!important}
.sheet{max-width:720px;margin:0 auto;padding:0 40px}
#title{width:100%;border:0;background:none;font:700 2.4rem/1.1 system-ui;letter-spacing:-.02em;color:var(--ink);outline:0;margin-bottom:18px}
#title::placeholder{color:#C9BFAE}
#editor{outline:0;min-height:60vh;font-size:1.02rem}
#editor:empty:before{content:"Yazmaya başla… (sağ tık ile blok ekle)";color:#B8AE9C}
#editor h1{font-size:1.7rem;line-height:1.2;letter-spacing:-.015em;margin:1.2em 0 .3em}
#editor h2{font-size:1.3rem;line-height:1.25;letter-spacing:-.01em;margin:1em 0 .2em}
#editor blockquote{border-left:3px solid var(--accent);margin:.6em 0;padding:.1em 0 .1em 14px;color:#5A5145}
#editor img{max-width:100%;border-radius:10px;margin:.5em 0;box-shadow:0 4px 18px rgba(60,40,10,.12)}
#editor mark{background:#F6DE8D;border-radius:3px;padding:0 2px}
#editor ul.todo{list-style:none;padding-left:4px}
#editor ul.todo li{position:relative;padding-left:26px}
#editor ul.todo li:before{content:"";position:absolute;left:0;top:.3em;width:15px;height:15px;border:1.5px solid var(--mute);border-radius:4px;cursor:pointer}
#editor ul.todo li.done{color:var(--mute);text-decoration:line-through}
#editor ul.todo li.done:before{background:var(--accent);border-color:var(--accent)}
#editor pre{background:rgba(0,0,0,.05);padding:12px 14px;border-radius:8px;font:.9rem ui-monospace,Menlo,monospace;white-space:pre-wrap}
/* context menu */
#menu{position:fixed;z-index:50;min-width:210px;padding:6px;border-radius:12px;background:var(--glass);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.6);box-shadow:0 12px 40px rgba(50,35,10,.22),0 0 0 .5px rgba(0,0,0,.12);
  display:none;transform-origin:top left}
#menu.show{display:block;animation:pop .18s cubic-bezier(.2,.9,.3,1)}
@keyframes pop{from{opacity:0;transform:scale(.94);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
#menu button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;font:inherit;font-size:.88rem;padding:6px 10px;border-radius:7px;text-align:left;cursor:pointer;color:var(--ink)}
#menu button:hover{background:var(--accent);color:#fff}
#menu button span{width:18px;text-align:center;opacity:.8}
#menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
/* canvas */
#canvasView{position:absolute;inset:0;display:none;overflow:hidden;cursor:default;
  background-image:radial-gradient(rgba(80,60,30,.18) 1px,transparent 1px);background-size:22px 22px}
#canvasView .hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--mute);pointer-events:none;text-align:center}
.sticky{position:absolute;width:200px;min-height:170px;padding:30px 14px 14px;border-radius:4px 4px 14px 4px;
  box-shadow:0 2px 4px rgba(0,0,0,.06),0 10px 24px rgba(60,40,10,.16);touch-action:none;will-change:transform}
.sticky.drag{box-shadow:0 6px 10px rgba(0,0,0,.08),0 24px 48px rgba(60,40,10,.26)}
.sticky{cursor:grab;user-select:none;-webkit-user-select:none}.sticky .txt{user-select:text;-webkit-user-select:text;cursor:text}
.sticky .grip{position:absolute;top:8px;left:50%;width:34px;height:4px;margin-left:-17px;border-radius:2px;background:rgba(0,0,0,.15)}
.sticky.drag,.sticky.drag .txt{cursor:grabbing}
.sticky.drag .grip{cursor:grabbing}
.sticky .del{position:absolute;top:4px;right:6px;border:0;background:none;cursor:pointer;opacity:0;color:rgba(0,0,0,.45);font-size:15px}
.sticky:hover .del{opacity:1}
.sticky .txt{outline:0;font-size:.95rem;min-height:110px;line-height:1.4}
.c0{background:#FCE98A}.c1{background:#F9C6C9}.c2{background:#C9E4C0}.c3{background:#BFDCF0}.c4{background:#DCCDEE}
.c5{background:color-mix(in srgb,var(--p0) 38%,#fffdf6)}.c6{background:color-mix(in srgb,var(--p1) 38%,#fffdf6)}.c7{background:color-mix(in srgb,var(--p2) 38%,#fffdf6)}.c8{background:color-mix(in srgb,var(--p3) 38%,#fffdf6)}
#cover{height:220px;position:relative;background-size:cover;background-position:center;display:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#cover.on{display:block}
#cover .acts{position:absolute;right:18px;bottom:12px;display:flex;gap:6px;opacity:0;transition:opacity .15s}
#cover:hover .acts{opacity:1}
.chip{border:0;font:inherit;font-size:.78rem;padding:5px 10px;border-radius:7px;color:var(--ink);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);cursor:pointer}
#addCover{background:none;color:var(--mute);padding:4px 0;margin-bottom:6px;opacity:0;transition:opacity .15s}
.sheet:hover #addCover{opacity:1}
#menu{max-height:80vh;overflow:auto}
.sw{display:inline-block;width:18px;height:12px;border-radius:3px}
#sPal{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:6px 0 12px;max-height:200px;overflow:auto;padding:2px}
#sPal button{height:34px;border:2px solid transparent;border-radius:8px;cursor:pointer;padding:0;overflow:hidden;display:flex}
#sPal button i{flex:1}
#sPal button.on{border-color:var(--ink)}
body.f-serif #editor,body.f-serif #title{font-family:"New York","Iowan Old Style",Georgia,serif}
body.f-hand #editor,body.f-hand #title,body.f-hand .sticky .txt{font-family:"Bradley Hand","Noteworthy","Chalkboard SE",cursive}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:8px}
#brand{margin:2px 10px 10px;font:700 1.35rem/1 "Fraunces",Georgia,serif;letter-spacing:-.02em;color:var(--accent)}
#hello{margin:0 10px 8px;font-weight:600;font-size:1.05rem;letter-spacing:-.01em}
#status{font-size:.72rem;color:var(--mute);padding:4px 10px}
#status.err{color:#B3261E;font-weight:600}
/* palet renkleri otomatik: başlıklar, alıntı, madde işaretleri */
#title{color:color-mix(in srgb,var(--p0) 75%,var(--ink))}
#editor h1{color:var(--p0)}
#editor h2{color:color-mix(in srgb,var(--p2) 85%,var(--ink))}
#editor blockquote{border-left-color:var(--p1)}
#editor li::marker{color:var(--p0);font-weight:700}
#editor b,#editor strong{color:color-mix(in srgb,var(--p2) 60%,var(--ink))}
#fbar{position:fixed;z-index:40;display:none;align-items:center;gap:2px;padding:4px;border-radius:10px;
  background:rgba(43,38,32,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 8px 24px rgba(0,0,0,.25);transform:translateX(-50%)}
#fbar.show{display:flex;animation:pop .15s cubic-bezier(.2,.9,.3,1)}
#fbar button{border:0;background:none;color:#F4EEE1;font:600 .85rem system-ui;min-width:28px;height:28px;border-radius:6px;cursor:pointer}
#fbar button:hover{background:rgba(255,255,255,.14)}
#fbar .dot{min-width:22px;width:22px;height:22px;border-radius:50%;margin:0 2px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}
#fbar .sep{width:1px;height:18px;background:rgba(255,255,255,.2);margin:0 3px}
#fpal{position:absolute;top:38px;left:50%;transform:translateX(-50%);width:300px;max-height:300px;overflow:auto;display:none;
  background:rgba(43,38,32,.95);border-radius:10px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#fpal.show{display:block}
#fpal .row{display:flex;align-items:center;gap:4px;padding:3px 4px;border-radius:6px}
#fpal .row:hover{background:rgba(255,255,255,.08)}
#fpal .row span{color:rgba(244,238,225,.55);font:.7rem system-ui;width:56px}
#fpal .row .dot{margin:0}
@media print{#fbar{display:none!important}}
body.f-lora :is(#editor,#title){font-family:Lora,Georgia,serif}
body.f-fraunces :is(#editor,#title){font-family:Fraunces,Georgia,serif;font-optical-sizing:auto}
body.f-nunito :is(#editor,#title){font-family:Nunito,system-ui,sans-serif}
body.f-caveat :is(#editor,#title,.sticky .txt){font-family:Caveat,cursive;font-size:1.25em}
body.f-caveat #title{font-size:2.8rem}
body.f-patrick :is(#editor,#title,.sticky .txt){font-family:"Patrick Hand",cursive}
body.f-mono :is(#editor,#title){font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.92em}
/* arama */
#search{margin:0 4px 6px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.5);font:inherit;font-size:.85rem;outline:0}
#search:focus{border-color:var(--accent);background:var(--surface)}
/* mikrofon */
#mic{border:0;background:rgba(0,0,0,.06);border-radius:999px;height:30px;padding:0 12px;font:inherit;font-size:.82rem;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--ink)}
#mic:active{transform:scale(.96)}
#mic.rec{background:#C8402F;color:#fff}
#mic.rec:before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
#interim{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:45;max-width:70vw;padding:10px 16px;border-radius:12px;
  background:rgba(43,38,32,.88);color:#F4EEE1;font-size:.9rem;display:none;backdrop-filter:blur(12px)}
#interim.show{display:block}
#interim .x{float:right;margin:-2px -6px 0 12px;border:0;background:rgba(255,255,255,.15);color:#fff;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:.7rem}
#interim .x:hover{background:rgba(255,255,255,.3)}
#interim small{display:block;opacity:.6;font-size:.72rem;margin-top:3px}
/* şablon seçici */
#tpl{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(40,30,15,.25)}
#tpl.show{display:grid}
#tpl .box{width:min(560px,94vw);background:var(--paper);border-radius:18px;padding:22px;box-shadow:0 20px 60px rgba(40,30,10,.3)}
#tpl .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
#tpl .card{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 12px;text-align:left;cursor:pointer;font:inherit}
#tpl .card:hover{border-color:var(--accent);transform:translateY(-1px)}
#tpl .card:active{transform:scale(.98)}
#tpl .card b{display:block;margin:6px 0 2px;font-size:.92rem}
#tpl .card small{color:var(--mute);font-size:.76rem;line-height:1.3;display:block}
#tpl .card .e{font-size:1.4rem}
#wc{float:right}
@media (max-width:640px){#tpl .grid{grid-template-columns:repeat(2,1fr)}}
/* ---------- ajanda ---------- */
#agendaView{position:absolute;inset:52px 0 0;display:none;overflow:auto;padding:22px 28px 60px}
.ag-top{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.ag-top h2{margin:0 8px 0 0;font-size:1.5rem;letter-spacing:-.02em;line-height:1.1}
.ag-top h2 small{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}
.ag-top .nav{border:0;background:rgba(0,0,0,.06);min-width:30px;height:30px;border-radius:8px;cursor:pointer;font:inherit;color:var(--ink);padding:0 10px}
.ag-top .nav:active{transform:scale(.95)}
.ag-top .nav.on{background:var(--ink);color:var(--paper)}
.ag-top .sp{flex:1}
.paper-grid{background-color:var(--surface);background-image:linear-gradient(rgba(90,70,40,.075) 1px,transparent 1px),linear-gradient(90deg,rgba(90,70,40,.075) 1px,transparent 1px);background-size:12px 12px}
.yr{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:26px 30px}
.mini h4{margin:0 0 8px;font-size:.92rem;font-weight:600}.mini h4 i{font-style:normal;color:var(--mute);font-weight:400;font-size:.78rem}
.mini .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:.74rem;text-align:center;font-variant-numeric:tabular-nums}
.mini .g b{color:var(--mute);font-size:.62rem;padding-bottom:3px}
.mini .g span{padding:3px 0;border-radius:6px;cursor:pointer;position:relative}
.mini .g span[data-k]:hover{background:rgba(0,0,0,.06)}
.mini .g span.has:after{content:"";position:absolute;bottom:0;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.mini .g span.today{background:var(--accent);color:#fff}
.mon{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,1.2fr);border:1px solid rgba(60,45,20,.25);border-radius:10px;overflow:hidden}
.mon .hd{font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;padding:7px 8px;color:var(--ink);border-bottom:1px solid rgba(60,45,20,.25);font-weight:600}
.mon .hd i{font-style:normal;color:var(--mute);font-weight:400}
.cell{min-height:112px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 6px;cursor:text}
.cell.out{opacity:.35}
.cell .d{font-size:.74rem;font-weight:700;display:inline-block;min-width:18px;border-top:2px solid var(--ink);margin-bottom:3px;cursor:pointer;padding-top:1px}
.cell.today .d{border-color:var(--accent);color:var(--accent)}
.cell.note{border-right:0;outline:0;font-size:.78rem;line-height:1.35;color:#5A5145}
.it{font-size:.8rem;line-height:1.3;padding:1px 0;display:flex;gap:5px;align-items:flex-start;animation:itIn .18s cubic-bezier(.2,.9,.3,1)}
@keyframes itIn{from{opacity:0;transform:translateY(-3px)}}
.it input{margin:2px 0 0;accent-color:var(--accent);flex:none;cursor:pointer}
.it .tx{flex:1;outline:0;word-break:break-word;border-radius:2px;padding:0 2px;cursor:text}
.it.done .tx{text-decoration:line-through;text-decoration-color:var(--accent);text-decoration-thickness:2px;color:var(--mute)}
.it .bell{font-size:.68rem;flex:none}
.wk{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px}
.wk .days{border:1px solid rgba(60,45,20,.25);border-radius:10px;overflow:hidden}
.wk .day{display:grid;grid-template-columns:86px 1fr;border-bottom:1px solid var(--line);min-height:88px}
.wk .day:last-child{border-bottom:0}
.wk .lb{padding:8px 10px;font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);border-right:1px solid var(--line);font-weight:600}
.wk .lb b{display:block;font-size:1.35rem;color:var(--ink);letter-spacing:-.02em;line-height:1.1}
.wk .day.today .lb b{color:var(--accent)}
.wk .lst{padding:6px 8px;cursor:text}
.wk .free{border:1px solid rgba(60,45,20,.25);border-radius:10px;padding:12px 14px;outline:0;min-height:640px;line-height:24px;font-size:.92rem}
.wk .free:empty:before{content:"Haftalık serbest not alanı…";color:#B8AE9C}
.ag-hint{font-size:.74rem;color:var(--mute);margin-top:12px}
.cell,.wk .day,.mini .g span{transition:background .2s,box-shadow .2s}
/* defter görünümü */
.br{font-size:1.15rem;font-weight:400;letter-spacing:-.01em}.br b{font-weight:800}
.mstrip{display:flex;gap:2px;margin:-6px 0 10px;justify-content:flex-end}
.mstrip button{border:0;background:none;font:500 .8rem system-ui;color:var(--ink);width:24px;height:24px;border-radius:50%;cursor:pointer;font-variant-numeric:tabular-nums}
.mstrip button:hover{background:rgba(0,0,0,.06)}
.mstrip button.on{background:var(--accent);color:#fff}
.mon .cell:not(.note){aspect-ratio:1/1;min-height:0;overflow:auto}
.mon .cell{min-height:0}
.mon .hd{font-weight:500}
.mini .g .en{font-weight:400;font-size:.56rem;opacity:.7;padding-bottom:5px}
.mini h4{font-weight:500}.mini h4 b{font-weight:700}
.wk .day{display:block;min-height:0;border-bottom:1px solid rgba(60,45,20,.25)}
.wk .lb{border-right:0;padding:6px 10px 0;display:flex;align-items:baseline;gap:6px;color:var(--ink);font-weight:500}
.wk .lb b{display:inline;font-size:.66rem;font-weight:500;color:var(--mute)}
.wk .lb .num{margin-left:auto;font-size:1rem;font-weight:700;border-top:2px solid var(--ink);padding-top:1px;letter-spacing:-.02em}
.wk .day.today .lb .num{border-color:var(--accent);color:var(--accent)}
.wk .lst{min-height:76px}
/* büyütme */
.yr{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.mini .g{font-size:.9rem;gap:3px}.mini .g b{font-size:.72rem}.mini h4{font-size:1.05rem}
.mon .hd{font-size:.74rem}.cell .d{font-size:.9rem}.it{font-size:.88rem}
#agInner{zoom:var(--agz,1)}
.zoom{display:flex;align-items:center;gap:2px;background:rgba(0,0,0,.06);border-radius:8px;padding:2px}
.zoom button{border:0;background:none;width:26px;height:26px;border-radius:6px;cursor:pointer;font:600 1rem system-ui;color:var(--ink)}
.zoom button:hover{background:rgba(255,255,255,.7)}
.zdock{position:fixed;right:20px;bottom:20px;z-index:30;padding:4px 6px;border-radius:12px;
  background:var(--glass);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  box-shadow:0 6px 24px rgba(50,35,10,.18),0 0 0 .5px rgba(0,0,0,.12)}
.zdock input{width:110px;accent-color:var(--accent);cursor:pointer}
.zoom span{font:500 .75rem system-ui;min-width:40px;text-align:center;font-variant-numeric:tabular-nums;cursor:pointer}
@media (max-width:860px){.wk{grid-template-columns:1fr}.mon{font-size:.85em}.cell{min-height:80px}}
@media print{#agendaView{display:none!important}}
/* ---------- temalar ---------- */
html,body,aside,header,#menu,.sheet,.cell,.wk .day,.paper-grid,#settings .box,#tpl .box{transition:background-color .35s ease,color .35s ease}
body.claude{--paper:#FAF9F5;--paper2:#F0EEE6;--ink:#1F1E1D;--mute:#87867F;--surface:#FFFFFF;--line:rgba(31,30,29,.1);--glass:rgba(250,249,245,.8);--accent:#D97757}
body.dark{--paper:#2A2723;--paper2:#221F1C;--ink:#ECE6DA;--mute:#9C9488;--surface:#33302B;--line:rgba(255,240,215,.1);--glass:rgba(42,39,35,.78)}
body.dark.claude{--paper:#262624;--paper2:#1F1E1D;--ink:#F5F4EE;--mute:#A6A39A;--surface:#30302E;--line:rgba(255,255,255,.09);--glass:rgba(38,38,36,.8)}
body:is(.dark,.claude){background:var(--paper);color:var(--ink)}
body.dark .paper-grid{background-image:linear-gradient(rgba(255,240,215,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,240,215,.06) 1px,transparent 1px)}
body.dark #canvasView{background-image:radial-gradient(rgba(255,240,215,.16) 1px,transparent 1px)}
body.dark .sticky .txt,body.dark .sticky{color:#2B2620}
body.dark #editor mark{color:#2B2620}
body.dark #title::placeholder,body.dark #editor:empty:before{color:#6E675D}
body.dark .seg button.on{background:var(--surface);color:var(--ink)}
body.dark .cell .d,body.dark .wk .lb .num{border-color:var(--ink)}
body.dark .mon,body.dark .wk .days,body.dark .wk .free{border-color:rgba(255,240,215,.2)}
body.dark .it .tx[style]{color:#1F1E1D}
body.dark #editor blockquote{color:#C9C1B3}
body.dark .pomo button:not(.ghost){background:var(--ink);color:var(--paper)}
#themeBtn{border:0;background:rgba(0,0,0,.06);border-radius:999px;width:30px;height:30px;cursor:pointer;font-size:.9rem}
body.dark #themeBtn,body.dark #mic:not(.rec){background:rgba(255,255,255,.08)}
#settings{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(40,30,15,.25)}
#settings.show{display:grid}
#settings .box{width:min(380px,92vw);background:var(--paper);border-radius:16px;padding:22px;box-shadow:0 20px 60px rgba(40,30,10,.3)}
#settings label{display:flex;justify-content:space-between;align-items:center;margin:10px 0;font-size:.9rem;gap:12px}
#settings input,#settings select{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
#settings input[type=number]{width:70px}
@media print{
  @page{margin:18mm}
  aside,header,#canvasView,#menu,#settings{display:none!important}
  #app{display:block;height:auto}main{overflow:visible}
  #editorView{display:block!important;overflow:visible;height:auto;padding:0}
  html,body{background:#fff;height:auto}.sheet{padding:0;max-width:none}
  #editor img{box-shadow:none;break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){#menu.show{animation:fade .15s}@keyframes fade{from{opacity:0}}}
@media (prefers-reduced-transparency:reduce){header,#menu{background:var(--surface);backdrop-filter:none}}
</style>
</head>

<div id="app">
  <aside>
    <div id="brand">Dumb Notion</div>
    <div id="hello"></div>
    <h2>Dersler</h2>
    <div id="pages"></div>
    <button class="btn" id="addPage">＋ Yeni sayfa</button>

/* ---------- veri ---------- */
const KEY='dersNotlari.v1';
const uid=()=>Math.random().toString(36).slice(2,9);
let db;
try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!db||!db.pages?.length){const id=uid();db={active:id,pages:[{id,title:'İlk dersim',html:'<p>Hoş geldin! Sağ tıkla ve blok ekle.</p>',notes:[]}]}}
db.settings=Object.assign({name:'',accent:'#C2652A',paper:'#F4EEE1',font:'',focus:25,brk:5,pal:0},db.settings);
try{navigator.storage?.persist?.()}catch(e){}
let saveT;
function saveNow(){const st=document.querySelector('#status');
  try{localStorage.setItem(KEY,JSON.stringify(db));st.textContent='Kaydedildi ✓';st.className=''}
  catch(e){st.textContent='⚠️ KAYDEDİLEMEDİ: alan doldu (büyük resimler). Yedek indir!';st.className='err'}}
const save=()=>{clearTimeout(saveT);document.querySelector('#status').textContent='Kaydediliyor…';saveT=setTimeout(saveNow,300)};
addEventListener('beforeunload',()=>{clearTimeout(saveT);saveNow()});
const cur=()=>db.pages.find(p=>p.id===db.active);

/* ---------- sayfalar ---------- */
const $=s=>document.querySelector(s);
function renderPages(){
  $('#pages').innerHTML='';
  db.pages.forEach(p=>{
    const d=document.createElement('div');d.className='page'+(p.id===db.active?' on':'');
    d.innerHTML=`<span>${(p.title||'Başlıksız').replace(/</g,'&lt;')}</span><button class="x" title="Sil">×</button>`;
    d.onpointerdown=e=>{if(e.target.classList.contains('x'))return;db.active=p.id;load();save()};
    d.querySelector('.x').onclick=()=>{if(db.pages.length<2||!confirm('Bu sayfa silinsin mi?'))return;db.pages=db.pages.filter(x=>x!==p);db.active=db.pages[0].id;load();save()};
    $('#pages').appendChild(d);
  });
}
function load(){const p=cur();$('#title').value=p.title;$('#editor').innerHTML=p.html;renderPages();renderNotes();renderCover()}

  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(f)})}

/* ---------- kanvas: yapışkan notlar (spring + momentum) ---------- */
const cv=$('#canvasView');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const project=(v,d=0.998)=>(v/1000)*d/(1-d);             // Apple momentum projeksiyonu
const rubber=(o,dim,c=0.55)=>(o*dim*c)/(dim+c*Math.abs(o)); // lastik sınır
function spring(el,from,to,vel,{damping=0.8,response=0.4}={},onEnd){ // x ve y ayrı yaylar
  const k=(2*Math.PI/response)**2,c=4*Math.PI*damping/response;
  let p={...from},v={...vel},last=performance.now();cancelAnimationFrame(el._raf);
  const step=t=>{let dt=Math.min((t-last)/1000,1/30);last=t;let done=true;
    for(const a of['x','y']){const f=-k*(p[a]-to[a])-c*v[a];v[a]+=f*dt;p[a]+=v[a]*dt;if(Math.abs(v[a])>2||Math.abs(p[a]-to[a])>.3)done=false}
    if(done)p={...to};el.style.transform=`translate(${p.x}px,${p.y}px)`;el._pos=p;
    if(!done)el._raf=requestAnimationFrame(step);else onEnd&&onEnd()};
  el._raf=requestAnimationFrame(step);
}
function bounds(){return{w:cv.clientWidth-200,h:cv.clientHeight-180,top:60}}
function renderNotes(){
  cv.querySelectorAll('.sticky').forEach(n=>n.remove());
  const notes=cur().notes;cv.querySelector('.hint').style.display=notes.length?'none':'';
  notes.forEach(makeSticky);
}
let zTop=1;
function makeSticky(n){
  const el=document.createElement('div');el.className='sticky c'+(n.c||0);
  el.innerHTML=`<div class="grip"></div><button class="del">×</button><div class="txt" contenteditable="true"></div>`;
  el.querySelector('.txt').innerText=n.text||'';el._pos={x:n.x,y:n.y};el.style.transform=`translate(${n.x}px,${n.y}px)`;
  el.querySelector('.txt').oninput=e=>{n.text=e.target.innerText;save()};
  el.querySelector('.del').onclick=()=>{cur().notes=cur().notes.filter(x=>x!==n);el.remove();save();renderNotes()};
  el.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();
    const SC=[['Sarı','#FCE98A'],['Pembe','#F9C6C9'],['Yeşil','#C9E4C0'],['Mavi','#BFDCF0'],['Mor','#DCCDEE']];
    const pick=i=>()=>{n.c=i;el.classList.remove(...[...el.classList].filter(c=>/^c\d$/.test(c)));el.classList.add('c'+i);save()};
    openMenu(e.clientX,e.clientY,[...SC.map(([t,c],i)=>[`<i class="sw" style="background:${c}"></i>`,t,pick(i)]),'-',...[0,1,2,3].map(i=>[`<i class="sw" style="background:var(--p${i})"></i>`,'Palet rengi '+(i+1),pick(5+i)])])});
  const grip=el,txt=el.querySelector('.txt');let off,hist=[],start,moved;
  el.style.zIndex=++zTop;
  grip.addEventListener('pointerdown',e=>{
    if(e.button!==0||e.target.closest('.del'))return;
    el.style.zIndex=++zTop; // öne getir (DOM taşımadan; taşımak sürüklemeyi koparıyordu)
    if(e.target.closest('.txt')&&document.activeElement===txt)return; // yazarken metin seçimi
    e.preventDefault();grip.setPointerCapture(e.pointerId);cancelAnimationFrame(el._raf); // yakala: anlık konumdan devam
    off={x:e.clientX-el._pos.x,y:e.clientY-el._pos.y};start={x:e.clientX,y:e.clientY};moved=false;hist=[{x:e.clientX,y:e.clientY,t:e.timeStamp}];
  });
  grip.addEventListener('pointermove',e=>{if(!off)return;
    if(!moved){if(Math.hypot(e.clientX-start.x,e.clientY-start.y)<4)return;moved=true;el.classList.add('drag');txt.blur()}
    const b=bounds();let x=e.clientX-off.x,y=e.clientY-off.y;
    if(x<0)x=-rubber(-x,200);if(x>b.w)x=b.w+rubber(x-b.w,200);
    if(y<b.top)y=b.top-rubber(b.top-y,180);if(y>b.h)y=b.h+rubber(y-b.h,180);
    el._pos={x,y};el.style.transform=`translate(${x}px,${y}px)`;
    hist.push({x:e.clientX,y:e.clientY,t:e.timeStamp});if(hist.length>5)hist.shift();
  });
  const end=()=>{if(!off)return;off=null;el.classList.remove('drag');if(!moved){txt.focus();const s=getSelection();s.selectAllChildren(txt);s.collapseToEnd();return}
    const a=hist[0],z=hist[hist.length-1],dt=Math.max((z.t-a.t)/1000,.016);
    const v={x:(z.x-a.x)/dt,y:(z.y-a.y)/dt},b=bounds();
    let tx=el._pos.x+(reduce?0:project(v.x,0.99)),ty=el._pos.y+(reduce?0:project(v.y,0.99));
    tx=Math.max(0,Math.min(b.w,tx));ty=Math.max(b.top,Math.min(b.h,ty));
    const fast=Math.hypot(v.x,v.y)>300;
    if(reduce){el.style.transform=`translate(${tx}px,${ty}px)`;el._pos={x:tx,y:ty}}
    else spring(el,el._pos,{x:tx,y:ty},v,{damping:fast?0.8:1,response:0.4});
    n.x=tx;n.y=ty;save();
  };
  grip.addEventListener('pointerup',end);grip.addEventListener('pointercancel',end);
  cv.appendChild(el);return el;
}
cv.addEventListener('dblclick',e=>{if(e.target!==cv)return;
  const n={id:uid(),x:e.offsetX-100,y:e.offsetY-20,text:'',c:cur().notes.length%5};cur().notes.push(n);save();
  cv.querySelector('.hint').style.display='none';const el=makeSticky(n);
  if(!reduce){el.style.scale='.85';el.animate([{scale:.85,opacity:0,filter:'blur(4px)'},{scale:1,opacity:1,filter:'none'}],{duration:220,easing:'cubic-bezier(.2,.9,.3,1)'}).onfinish=()=>el.style.scale=''}

const P={focus:db.settings.focus*60,brk:db.settings.brk*60};let mode='focus',left=P.focus,run=false,endAt=0,tick;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function draw(){$('#pTime').textContent=fmt(left);$('#pMode').textContent=mode==='focus'?'Odak':'Mola';

function ding(){try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);
  g.gain.setValueAtTime(.25,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+1.2);o.start();o.stop(a.currentTime+1.2)}catch(e){}
  try{new Notification(mode==='focus'?'Mola zamanı ☕':'Odak zamanı 📚')}catch(e){}}
$('#pGo').onpointerdown=()=>{run=!run;if(run){endAt=Date.now()+left*1000;try{Notification.requestPermission()}catch(e){}
  tick=setInterval(()=>{left=Math.max(0,Math.round((endAt-Date.now())/1000));if(!left){ding();nextMode();endAt=Date.now()+left*1000}draw()},250)}
  else clearInterval(tick);draw()};

AV.addEventListener('focusout',e=>{const t=e.target;if(!t.classList?.contains('tx'))return;const f=findIt(t);
  if(f&&!t.innerText.trim()){delIt(f.k,f.it.id);f.d.remove()}});
const HL=[['Sarı','#F6DE8D'],['Pembe','#F7B8C6'],['Yeşil','#BFE3B4'],['Mavi','#B7D7F0'],['Turuncu','#F8C69A']];
// gün vurgulama: güne sağ tık → fosforlu renk
db.dayHL=db.dayHL||{};
const dayKey=t=>t.closest('[data-add]')?.dataset.add||t.closest('.day')?.querySelector('[data-add]')?.dataset.add||(t.closest('.mini')&&t.dataset.k);
function paintDays(){AV.querySelectorAll('[data-add],.mini span[data-k]').forEach(n=>{const k=n.dataset.add||n.dataset.k,c=db.dayHL[k];
  const tgt=n.classList.contains('lst')?n.closest('.day'):n;
  if(n.matches('.mini span'))n.style.boxShadow=c?`inset 0 0 0 20px ${c}`:'';else tgt.style.background=c?`linear-gradient(${c}CC,${c}CC)`:''})}
AV.addEventListener('contextmenu',e=>{if(findIt(e.target))return;const k=dayKey(e.target);if(!k)return;e.preventDefault();
  const setD=c=>()=>{if(c)db.dayHL[k]=c;else delete db.dayHL[k];save();paintDays()};
  openMenu(e.clientX,e.clientY,[...HL.map(([n,c])=>[`<i class="sw" style="background:${c}"></i>`,'Günü '+n.toLocaleLowerCase('tr')+' boya',setD(c)]),
    [`<i class="sw" style="background:var(--p0)"></i>`,'Palet rengi',setD(getComputedStyle(document.documentElement).getPropertyValue('--p0').trim().slice(0,7)+'55')],
    ...(db.dayHL[k]?['-',['⌫','Vurguyu kaldır',setD(null)]]:[]),...(ag.v==='yil'?[]:['-',['＋','Bu güne madde ekle',()=>addIt(k)]])])});
AV.addEventListener('contextmenu',e=>{const f=findIt(e.target);if(!f)return;e.preventDefault();
  const set=(fn)=>()=>{fn();save();renderAg()};
  openMenu(e.clientX,e.clientY,[
    ['S̶',f.it.done?'Çizgiyi kaldır':'Üstünü çiz',set(()=>f.it.done=!f.it.done)],'-',
    ...HL.map(([n,c])=>[`<i class="sw" style="background:${c}"></i>`,n+' fosforlu',set(()=>f.it.hl=c)]),
    [`<i class="sw" style="background:var(--p0)"></i>`,'Palet rengi',set(()=>f.it.hl=getComputedStyle(document.documentElement).getPropertyValue('--p0').trim()+'66')],
    ...(f.it.hl?[['⌫','Fosforu kaldır',set(()=>delete f.it.hl)]]:[]),'-',
    ['🔔',f.it.rem?'Hatırlatıcıyı değiştir':'Hatırlatıcı kur…',()=>{const v=prompt(`${f.k} için saat? (ör. 09:30)`,f.it.rem?new Date(f.it.rem).toTimeString().slice(0,5):'09:00');
      if(v===null)return;const m=v.match(/^(\d{1,2})[:.](\d{2})$/);if(!m)return alert('Saat biçimi: 09:30');
      const[y,mo,d]=f.k.split('-').map(Number);f.it.rem=new Date(y,mo-1,d,+m[1],+m[2]).toISOString();f.it.fired=false;
      try{Notification.requestPermission()}catch(_){}save();renderAg()}],
    ...(f.it.rem?[['🔕','Hatırlatıcıyı kaldır',set(()=>{delete f.it.rem;delete f.it.fired})]]:[]),'-',
    ['🗑','Sil',()=>{delIt(f.k,f.it.id);renderAg()}]])});
// ölçekleme: −/+ düğmeleri, ⌘+/⌘−/⌘0, ⌃+tekerlek veya trackpad ile iki parmak sıkıştırma
function setZoom(d,abs){S.agz=Math.round(Math.min(2.5,Math.max(.6,abs?d:d===0?1:(S.agz||1)+d*.1))*100)/100;
  AV.style.setProperty('--agz',S.agz);const sp=AV.querySelector('.zoom span');if(sp)sp.textContent=Math.round(S.agz*100)+'%';
  const zr=AV.querySelector('#zr');if(zr&&document.activeElement!==zr)zr.value=Math.round(S.agz*100);save()}
AV.addEventListener('input',e=>{if(e.target.id==='zr')setZoom(e.target.value/100,true)});
AV.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();setZoom((S.agz||1)*Math.exp(-e.deltaY*.01),true)},{passive:false});
addEventListener('keydown',e=>{if(AV.style.display!=='block'||!(e.metaKey||e.ctrlKey))return;
  if(e.key==='='||e.key==='+'){e.preventDefault();setZoom(1)}else if(e.key==='-'){e.preventDefault();setZoom(-1)}else if(e.key==='0'){e.preventDefault();setZoom(0)}});
// hatırlatıcı kontrolü (uygulama açıkken)
function remind(it){try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=660;o.connect(g);g.connect(a.destination);
  g.gain.setValueAtTime(.25,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+1);o.start();o.stop(a.currentTime+1)}catch(_){}
  try{if(Notification.permission==='granted')new Notification('🔔 Hatırlatıcı',{body:it.t});else alert('🔔 '+it.t)}catch(_){alert('🔔 '+it.t)}}
setInterval(()=>{const n=Date.now();let ch=false;for(const k in db.agenda)for(const it of db.agenda[k])if(it.rem&&!it.fired&&new Date(it.rem)<=n){it.fired=true;ch=true;remind(it)}
  if(ch){save();if($('#agendaView').style.display==='block')renderAg()}},15000);

/* tema */
S.theme=S.theme||"day";S.style=S.style||"paper";
const mq=matchMedia("(prefers-color-scheme: dark)");
function isDark(){return S.theme==="night"||(S.theme==="auto"&&mq.matches)}
mq.addEventListener("change",()=>S.theme==="auto"&&applyS());
$("#mic").insertAdjacentHTML("beforebegin","<button id=\"themeBtn\" title=\"Gece / gündüz\"></button>");
$("#themeBtn").onclick=()=>{S.theme=isDark()?"day":"night";$("#sTheme").value=S.theme;applyS();save()};
for(const[id,k]of[["sTheme","theme"],["sStyle","style"]]){const el=$("#"+id);el.value=S[k];el.oninput=()=>{S[k]=el.value;applyS();save()}}

/* pomodoro: 2 saate kadar odak, kısa/uzun mola, hazır ayarlar */
S.lbrk=S.lbrk||15;S.every=S.every||4;let pDone=0;
for(const[id,k]of[["sLong","lbrk"],["sEvery","every"]]){const el=$("#"+id);el.value=S[k];el.oninput=()=>{S[k]=Math.max(1,+el.value||1);applyS();save()}}
function nextMode(){if(mode==="focus"){pDone++;mode=pDone%S.every===0?"lbrk":"brk"}else mode="focus";P.lbrk=S.lbrk*60;left=P[mode];draw()}
function setMode(m){clearInterval(tick);run=false;mode=m;P.lbrk=S.lbrk*60;left=P[m];draw()}
const _draw=draw;draw=function(){_draw();$("#pMode").textContent={focus:"Odak",brk:"Mola",lbrk:"Uzun mola"}[mode]+(pDone?" · "+pDone+"🍅":"")};
$("#pTime").style.cursor="pointer";$("#pTime").title="Süre ve mola seç";
$("#pTime").onclick=e=>{const pre=(f,b,l)=>()=>{S.focus=f;S.brk=b;S.lbrk=l;$("#sFocus").value=f;$("#sBreak").value=b;$("#sLong").value=l;save();applyS();setMode("focus")};
  openMenu(e.clientX-180,e.clientY+14,[["🍅","25 dk odak · 5 mola",pre(25,5,15)],["📘","50 dk odak · 10 mola",pre(50,10,20)],["📚","90 dk odak · 15 mola",pre(90,15,30)],["🧠","2 saat odak · 20 mola",pre(120,20,30)],
   ["✎","Özel süre…",()=>{const v=prompt("Odak süresi (dk, en fazla 120)",S.focus);if(v===null)return;const f=Math.min(120,Math.max(1,+v||25));
     const b=prompt("Mola süresi (dk)",S.brk);pre(f,Math.min(60,Math.max(1,+b||5)),S.lbrk)()}],"-",
   ["☕","Şimdi kısa mola ver",()=>setMode("brk")],["🛋","Şimdi uzun mola ver",()=>setMode("lbrk")],["▶","Odağa dön",()=>setMode("focus")],"-",
   ["↺","Sayaçları sıfırla",()=>{pDone=0;setMode("focus")}]])};

load();draw();applyS();wc();
</script>
</body>
</html>
